    <!-- Debug mode: ?debug=1 loads an in-page console (Eruda) and records a
         breadcrumb trail to localStorage. The trail survives a tab kill, so a
         large gallery reaped by iOS Safari's memory limit can still be
         diagnosed: reopen with ?debug=1 and the previous run's trail is dumped
         to the console. Entirely inert without ?debug=1. -->
    <script>
    (function () {
        // Always defined so instrumented call sites stay one-liners.
        window.ovgMark = function () {};

        // The flag is sticky, because published galleries embed this file in a
        // cross-origin iframe whose src we cannot add a query param to. Arming it
        // once in a direct tab latches it for this origin, so every later embed
        // records too. ?debug=0 disarms it.
        var STICKY = 'ovg_debug_on';
        var flag = new URLSearchParams(window.location.search).get('debug');
        var armed = (flag === '1');
        try {
            if (flag === '1') localStorage.setItem(STICKY, '1');
            else if (flag === '0') localStorage.removeItem(STICKY);
            else armed = (localStorage.getItem(STICKY) === '1');
        } catch (e) {}
        if (!armed) return;

        var KEY = 'ovg_debug_trail';
        var MAX = 300;
        var t0 = Date.now();
        var trail = [];
        var prev = null;

        // Read the trail the previous run left behind before overwriting it.
        try {
            var raw = localStorage.getItem(KEY);
            if (raw) prev = JSON.parse(raw);
        } catch (e) {}

        function store() {
            try { localStorage.setItem(KEY, JSON.stringify(trail)); } catch (e) {}
        }

        function stats() {
            var s = {};
            try {
                // Viewer locals are not globals; go through the engine store.
                var scene = BABYLON.EngineStore.LastCreatedScene;
                if (scene) {
                    s.meshes = scene.meshes.length;
                    s.verts = scene.getTotalVertices();
                    s.mats = scene.materials.length;
                    s.texs = scene.textures.length;
                    var bytes = 0;
                    for (var i = 0; i < scene.textures.length; i++) {
                        var sz = scene.textures[i].getSize();
                        // 4 bytes/texel, +33% for the mip chain
                        if (sz && sz.width) bytes += sz.width * sz.height * 4 * 1.33;
                    }
                    s.texMB = Math.round(bytes / 1048576);
                    s.fps = Math.round(scene.getEngine().getFps());
                }
            } catch (e) {}
            return s;
        }

        window.ovgMark = function (label, extra) {
            var e = { t: Date.now() - t0, m: label };
            var s = stats();
            for (var k in s) e[k] = s[k];
            if (extra) e.x = String(extra);
            trail.push(e);
            if (trail.length > MAX) trail.splice(0, trail.length - MAX);
            store();
            console.log('[ovg] ' + e.t + 'ms', label,
                (s.texMB === undefined) ? '' : '(' + s.meshes + ' meshes, ' + s.texMB + ' MB tex)',
                extra || '');
        };

        window.ovgDebug = {
            prev: function () { console.table(prev || []); return prev; },
            trail: function () { console.table(trail); return trail; },
            stats: stats,
            clear: function () { try { localStorage.removeItem(KEY); } catch (e) {} },
            off: function () {
                try { localStorage.removeItem(STICKY); } catch (e) {}
                return 'debug disarmed for this origin - reload to take effect';
            }
        };

        window.addEventListener('error', function (ev) {
            ovgMark('ERROR', (ev.message || '') + ' @ ' + (ev.filename || '') + ':' + (ev.lineno || ''));
        });
        window.addEventListener('unhandledrejection', function (ev) {
            ovgMark('REJECT', (ev.reason && ev.reason.message) || ev.reason);
        });
        // A clean exit stamps the trail. A trail without this stamp was killed.
        window.addEventListener('pagehide', function () { ovgMark('pagehide (clean exit)'); });

        document.addEventListener('DOMContentLoaded', function () {
            var c = document.getElementById('renderCanvas');
            if (!c) return;
            // Highest-signal event for a memory death: it fires while the page
            // is still alive, whereas an OS kill leaves nothing behind.
            c.addEventListener('webglcontextlost', function () { ovgMark('WEBGL CONTEXT LOST'); });
            c.addEventListener('webglcontextrestored', function () { ovgMark('webgl context restored'); });
        });

        // Separates "died while loading" from "died while walking around".
        setInterval(function () { ovgMark('heartbeat'); }, 10000);

        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda';
        s.onload = function () {
            eruda.init();
            ovgMark('debug console ready', navigator.userAgent);
            if (!prev) return;
            var clean = prev.some(function (e) { return /clean exit/.test(e.m); });
            console.warn('[ovg] previous run: ' + prev.length + ' marks, ' +
                (clean ? 'exited cleanly' : 'NO clean exit - the tab was killed'));
            console.table(prev);
        };
        s.onerror = function () { ovgMark('eruda failed to load'); };
        document.head.appendChild(s);
    })();
    </script>

	<script>
	// URL-based mode overrides - must run before declarations.js
	// To use local templates/materials instead of CDN, set: window.openvgal_cdn_base = '';
	(function() {
		const urlParams = new URLSearchParams(window.location.search);
		if (urlParams.get('preview') === 'iframe' && window.parent) {
			window.openvgal_preview_mode = true;
			window.openvgal_cdn_base = window.parent.openvgal_cdn_base || window.location.origin;
			console.log('Preview mode: CDN base =', window.openvgal_cdn_base);
		}
		// Multi-tenant mode: ?openvgal_location=<absolute https URL> points the viewer
		// at a remote gallery (e.g. a published gallery on assets.openvgal.com).
		// Only https:// URLs are accepted, to avoid loading arbitrary third-party content.
		const locParam = urlParams.get('openvgal_location');
		if (locParam) {
			try {
				const u = new URL(locParam);
				if (u.protocol === 'https:') {
					window.openvgal_location = locParam;
					console.log('Remote location:', locParam);
				} else {
					console.warn('Ignoring openvgal_location: not https');
				}
			} catch (e) {
				console.warn('Ignoring openvgal_location: invalid URL');
			}
		}
		// Dev mode: serve repo root via static server, point viewer at examples/ + cdn/
		// Usage: from repo root run `python -m http.server 8080`, open
		//   http://localhost:8080/site/viewer.html?dev=1
		if (urlParams.get('dev') === '1') {
			window.openvgal_location = '/examples';
			window.openvgal_cdn_base = '/cdn';
			console.log('Dev mode: location=/examples, cdn=/cdn');
		}
	})();

	// SEO tags. Runs after the overrides above, so it sees the final value of
	// window.openvgal_location. Only an absolute https URL can produce a correct
	// canonical or og:url; the head default '.' and dev mode's '/examples' cannot,
	// so they are left alone rather than emitting './virtual.html'.
	(function() {
		const raw = window.openvgal_location;
		if (typeof raw !== 'string' || !/^https:\/\//i.test(raw.trim())) return;

		const baseUrl = raw.trim().replace(/\/+$/, '');
		const fullPageUrl = baseUrl + '/virtual.html';
		const imageUrl = baseUrl + '/preview.jpg';
		const providerUrl = baseUrl.replace('/virtual', '');

		// canonical and og:url carry no static value, so create them here.
		let canonical = document.querySelector('link[rel="canonical"]');
		if (!canonical) {
			canonical = document.createElement('link');
			canonical.rel = 'canonical';
			document.head.appendChild(canonical);
		}
		canonical.href = fullPageUrl;

		let ogUrl = document.querySelector('meta[property="og:url"]');
		if (!ogUrl) {
			ogUrl = document.createElement('meta');
			ogUrl.setAttribute('property', 'og:url');
			document.head.appendChild(ogUrl);
		}
		ogUrl.setAttribute('content', fullPageUrl);

		const ogImage = document.querySelector('meta[property="og:image"]');
		if (ogImage) ogImage.setAttribute('content', imageUrl);
		const twitterImage = document.querySelector('meta[name="twitter:image"]');
		if (twitterImage) twitterImage.setAttribute('content', imageUrl);

		const structuredData = document.querySelector('script[type="application/ld+json"]');
		if (structuredData) {
			try {
				const data = JSON.parse(structuredData.textContent);
				data['@id'] = fullPageUrl;
				data.url = fullPageUrl;
				data.image = imageUrl;
				if (data.provider) data.provider.url = providerUrl;
				structuredData.textContent = JSON.stringify(data, null, 2);
			} catch (e) {
				console.warn('Failed to update structured data:', e);
			}
		}
	})();
	</script>

    <script>
    function toggleMap() {
        var modal = document.getElementById('map-modal');
        if (!modal) return;
        var isHidden = modal.style.display === 'none' || modal.style.display === '';
        if (isHidden) {
            populateMap();
            modal.style.display = 'flex';
        } else {
            modal.style.display = 'none';
        }
    }

    function populateMap() {
        var grid = document.getElementById('map-grid');
        if (!grid || typeof config_file_content === 'undefined') return;
        grid.innerHTML = '';

        for (var galleryName in config_file_content) {
            if (galleryName === 'Technical') continue;

            var gallery = config_file_content[galleryName];
            var imageKeys = Object.keys(gallery).filter(function(k) {
                return gallery[k] && gallery[k].resource_type === 'image';
            });

            var card = document.createElement('div');
            card.className = 'map-card';
            if (galleryName === current_gallery) card.className += ' map-card-active';
            card.onclick = (function(name) {
                return function() { navigateToGallery(name); };
            })(galleryName);

            var wrap = document.createElement('div');
            wrap.className = 'map-card-thumb-wrap';
            if (imageKeys.length > 0) {
                var img = document.createElement('img');
                img.className = 'map-card-thumb';
                var resourcePath = gallery[imageKeys[0]].resource;
                img.src = (typeof window.resolveImageUrl === 'function')
                    ? window.resolveImageUrl(resourcePath)
                    : hallspics_prefix + resourcePath;
                img.alt = galleryName;
                img.loading = 'lazy';
                wrap.appendChild(img);
            } else {
                var placeholder = document.createElement('div');
                placeholder.className = 'map-card-placeholder';
                wrap.appendChild(placeholder);
            }
            card.appendChild(wrap);

            var info = document.createElement('div');
            info.className = 'map-card-info';

            var nameEl = document.createElement('p');
            nameEl.className = 'map-card-name';
            nameEl.textContent = galleryName === 'root' ? 'Main Hall' : galleryName.replace(/#/g, ' ');
            info.appendChild(nameEl);

            var countEl = document.createElement('p');
            countEl.className = 'map-card-count';
            countEl.textContent = imageKeys.length + (imageKeys.length === 1 ? ' artwork' : ' artworks');
            info.appendChild(countEl);

            card.appendChild(info);
            grid.appendChild(card);
        }
    }

    function navigateToGallery(name) {
        // Already here — nothing to swap.
        if (name === current_gallery) { toggleMap(); return; }

        // Prefer the in-scene swap (openvgal-viewer.js). A full page reload
        // spins up a second Babylon engine/WebGL context while the old
        // document is still resident, which spikes memory; galleryManager
        // instead disposes only the outgoing gallery and reuses the engine.
        if (typeof window.galleryManager === 'function') {
            document.getElementById('map-modal').style.display = 'none';
            // Keep the URL shareable/refresh-safe without triggering a reload.
            var p = new URLSearchParams(window.location.search);
            p.set('gallery', name);
            history.replaceState(null, '', window.location.pathname + '?' + p.toString());
            // Door-style synthetic event: galleryManager strips the d_ prefix
            // and _<n> tail to recover the gallery name (same as the boot event).
            window.galleryManager({ source: { name: 'd_' + name + '_1' } });
            return;
        }

        // Fallback: full reload if the in-scene swap isn't available.
        var params = new URLSearchParams(window.location.search);
        params.set('gallery', name);

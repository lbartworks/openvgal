<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hosting service — coming soon | OpenVGAL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' fill='%23faf8f3'/><polygon points='35.84,35.84 220.16,35.84 161.18,87.14 94.82,87.14' fill='%23fbf9f5'/><polygon points='35.84,35.84 94.82,87.14 94.82,153.5 35.84,220.16' fill='%23fefdfb'/><polygon points='220.16,35.84 161.18,87.14 161.18,153.5 220.16,220.16' fill='%23fefdfb'/><polygon points='35.84,220.16 220.16,220.16 161.18,153.5 94.82,153.5' fill='%23c89b6e'/><rect x='94.82' y='87.14' width='66.36' height='66.36' fill='%23fbf9f5'/><line x1='35.84' y1='35.84' x2='94.82' y2='87.14' stroke='%231c1c24' stroke-width='4.84'/><line x1='220.16' y1='35.84' x2='161.18' y2='87.14' stroke='%231c1c24' stroke-width='4.84'/><line x1='35.84' y1='220.16' x2='94.82' y2='153.5' stroke='%231c1c24' stroke-width='4.84'/><line x1='220.16' y1='220.16' x2='161.18' y2='153.5' stroke='%231c1c24' stroke-width='4.84'/><rect x='94.82' y='87.14' width='66.36' height='66.36' fill='none' stroke='%231c1c24' stroke-width='5.76'/><rect x='35.84' y='35.84' width='184.32' height='184.32' fill='none' stroke='%231c1c24' stroke-width='6.91'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.openvgal.com/core/brand.css">
  <style>
    /* ============================================================
       Hosting page — "Quiet Gallery" brand.
       Design tokens load from the shared stylesheet linked above
       (cdn.openvgal.com/core/brand.css, source site/css/brand.css);
       only page-specific rules live here.
       ============================================================ */

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink-2);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .brand { display: flex; align-items: center; gap: 13px; text-decoration: none; }
    .brand .mk { width: 36px; height: 36px; display: block; overflow: visible; }
    .brand .word {
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 21px;
      letter-spacing: -0.5px;
      color: var(--ink);
    }
    .nav-back {
      color: var(--ink-3);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .nav-back:hover { color: var(--ink); }
    .nav-back svg { width: 14px; height: 14px; }

    .hero {
      text-align: center;
      padding: 4rem 0 2rem;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--wood-deep);
      background: color-mix(in oklab, var(--wood) 14%, transparent);
      border: 1px solid color-mix(in oklab, var(--wood) 35%, transparent);
      padding: 0.35rem 0.9rem;
      border-radius: 100px;
      margin-bottom: 1.5rem;
    }
    .hero-badge-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--wood-deep);
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(2rem, 4.6vw, 2.8rem);
      font-weight: 600;
      letter-spacing: -1.5px;
      color: var(--ink);
      margin-bottom: 1rem;
      line-height: 1.15;
    }
    .gradient-text {
      font-family: var(--font-serif);
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.5px;
      color: var(--wood-deep);
    }
    .hero-sub {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--ink-2);
      max-width: 460px;
      margin: 0 auto;
    }

    .form-section {
      background: var(--room);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 1.5rem;
      margin-top: 2rem;
    }
    .form-title {
      font-family: var(--font-sans);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }
    .form-hint {
      font-size: 0.78rem;
      color: var(--ink-3);
      margin-bottom: 1.25rem;
      line-height: 1.6;
    }
    .form-embed {
      width: 100%;
      min-height: 480px;
      border: none;
      border-radius: 8px;
      background: var(--room-2);
    }
    .privacy-note {
      font-size: 0.72rem;
      color: var(--ink-3);
      margin-top: 0.85rem;
      text-align: center;
    }

    .placeholder-card {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--ink-3);
      border: 1px dashed var(--rule);
      border-radius: 10px;
    }
    .placeholder-card code {
      background: color-mix(in oklab, var(--wood) 18%, transparent);
      color: var(--wood-deep);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .footer-note {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--ink-3);
    }
    .footer-note a {
      color: var(--ink-2);
      text-decoration: none;
      border-bottom: 1px dotted var(--rule);
      transition: color 0.15s, border-color 0.15s;
    }
    .footer-note a:hover { color: var(--wood-deep); border-bottom-color: var(--wood-deep); }

    @media (max-width: 600px) {
      .hero { padding: 2.5rem 0 1.5rem; }
    }
  </style>
</head>
<body>
  <!-- Canonical "open threshold" mark, defined once, reused via <use>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="ovg-mark" viewBox="0 0 256 256">
      <polygon points="35.84,35.84 220.16,35.84 161.18,87.14 94.82,87.14" fill="oklch(0.985 0.004 80)"/>
      <polygon points="35.84,35.84 94.82,87.14 94.82,153.5 35.84,220.16" fill="oklch(0.995 0.002 80)"/>
      <polygon points="220.16,35.84 161.18,87.14 161.18,153.5 220.16,220.16" fill="oklch(0.995 0.002 80)"/>
      <polygon points="35.84,220.16 220.16,220.16 161.18,153.5 94.82,153.5" fill="oklch(0.78 0.065 68)"/>
      <rect x="94.82" y="87.14" width="66.36" height="66.36" fill="oklch(0.985 0.004 80)"/>
      <line x1="35.84" y1="35.84" x2="94.82" y2="87.14" stroke="oklch(0.16 0.01 270)" stroke-width="4.84"/>
      <line x1="220.16" y1="35.84" x2="161.18" y2="87.14" stroke="oklch(0.16 0.01 270)" stroke-width="4.84"/>
      <line x1="35.84" y1="220.16" x2="94.82" y2="153.5" stroke="oklch(0.16 0.01 270)" stroke-width="4.84"/>
      <line x1="220.16" y1="220.16" x2="161.18" y2="153.5" stroke="oklch(0.16 0.01 270)" stroke-width="4.84"/>
      <rect x="94.82" y="87.14" width="66.36" height="66.36" fill="none" stroke="oklch(0.16 0.01 270)" stroke-width="5.76"/>
      <rect x="35.84" y="35.84" width="184.32" height="184.32" fill="none" stroke="oklch(0.16 0.01 270)" stroke-width="6.91"/>
    </symbol>
  </svg>

  <div class="page-wrapper">
    <nav>
      <a href="/" class="brand">
        <svg class="mk" viewBox="0 0 256 256"><use href="#ovg-mark"/></svg>
        <span class="word">OpenVGal</span>
      </a>
      <a href="/" class="nav-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to OpenVGAL
      </a>
    </nav>

    <div class="hero">
      <div class="hero-badge">
        <span class="hero-badge-dot"></span>
        <span>Coming soon</span>
      </div>
      <h1>Hosting <span class="gradient-text">service</span></h1>
      <p class="hero-sub">
        Want us to host your gallery for you? Drop your email and we'll let you know when it's ready.
      </p>
    </div>

    <div class="form-section">
      <div class="form-title">Get notified at launch</div>
      <div id="formContainer"></div>
      <div class="privacy-note">We'll only email you about this launch. No spam, ever.</div>
    </div>

    <div class="footer-note">
      Stay in the loop — <a href="https://nostromophoto.com/newslettter/" target="_blank" rel="noopener">subscribe to the newsletter</a>.
    </div>
  </div>

  <script>
    // === Configurable constants — edit these before deploy ===
    // Google Form embed URL. Create a form at https://forms.google.com,
    // click Send → embed (<>) → copy the iframe src here.
    // Until set, the page shows a "not configured" placeholder.
    const HOSTING_FORM_URL = '';

    // Optional analytics endpoint. Leave empty to skip; or set to a URL that
    // accepts a POST with a small JSON body (e.g. a Cloudflare Worker, Plausible
    // custom event endpoint, or a Google Apps Script doPost handler).
    const ANALYTICS_ENDPOINT = '';

    // === End config ===

    // Render the form (or a clear placeholder so the page is still useful pre-config).
    const formContainer = document.getElementById('formContainer');
    if (HOSTING_FORM_URL) {
      const iframe = document.createElement('iframe');
      iframe.className = 'form-embed';
      iframe.src = HOSTING_FORM_URL;
      iframe.title = 'Hosting service interest form';
      iframe.loading = 'lazy';
      formContainer.appendChild(iframe);
    } else {
      formContainer.innerHTML =
        '<div class="placeholder-card">' +
        'Subscribe to the <a href="https://nostromophoto.com/newslettter/" target="_blank" rel="noopener" style="color:var(--wood-deep);">newsletter</a> ' +
        'and we\'ll let you know when it\'s ready.' +
        '</div>';
    }

    // Page-view beacon. Captures interest from people who view but don't submit.
    (function() {
      const payload = {
        event: 'hosting_page_view',
        ts: Date.now(),
        ref: document.referrer || null
      };
      if (ANALYTICS_ENDPOINT && navigator.sendBeacon) {
        try {
          const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
          navigator.sendBeacon(ANALYTICS_ENDPOINT, blob);
        } catch (e) {
          // Beacon failures are non-critical; never break the page.
        }
      }
      // Always log in console for local debugging.
      if (window.console) console.log('[openvgal] hosting page view:', payload);
    })();
  </script>
</body>
</html>

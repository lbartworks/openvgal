name: Deploy CDN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cdn/**'
      - 'site/declarations.js'
      - 'site/room_builder_aux.js'
      - 'site/overlay.js'
      - 'site/overlay.css'
      - 'site/overlay.html'
      - 'site/openvgal-viewer.js'
      - 'site/openvgal-lighting.js'
      - 'site/babylon.js'
      - 'site/babylonjs.loaders.min.js'
      - 'site/js/gallery-settings.js'
      - 'site/js/style-picker.js'
      - 'site/css/brand.css'
      - 'site/viewer.html'
      - 'site/icons/**'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CDN core
        run: |
          mkdir -p cdn/core/icons cdn/core/js
          cp site/js/gallery-settings.js cdn/core/js/
          cp site/js/style-picker.js cdn/core/js/
          cp site/css/brand.css cdn/core/
          cp site/declarations.js cdn/core/
          cp site/room_builder_aux.js cdn/core/
          cp site/overlay.js cdn/core/
          cp site/overlay.css cdn/core/
          cp site/overlay.html cdn/core/
          cp site/openvgal-viewer.js cdn/core/
          cp site/openvgal-lighting.js cdn/core/
          cp site/babylon.js cdn/core/
          cp site/babylonjs.loaders.min.js cdn/core/
          cp -r site/icons/* cdn/core/icons/

          # Build CDN viewer.html with absolute CDN script paths
          CDN=https://cdn.openvgal.com/core
          sed \
            -e "s|src=\"babylon.js\"|src=\"${CDN}/babylon.js\"|" \
            -e "s|src=\"babylonjs.loaders.min.js\"|src=\"${CDN}/babylonjs.loaders.min.js\"|" \
            -e "s|src='declarations.js'|src='${CDN}/declarations.js'|" \
            -e "s|src='room_builder_aux.js'|src='${CDN}/room_builder_aux.js'|" \
            -e "s|src='openvgal-viewer.js'|src='${CDN}/openvgal-viewer.js'|" \
            -e "s|src='openvgal-lighting.js'|src='${CDN}/openvgal-lighting.js'|" \
            -e "s|href=\"overlay.css\"|href=\"${CDN}/overlay.css\"|" \
            site/viewer.html > cdn/core/viewer.html

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cdn --project-name=openvgal-cdn --branch=main

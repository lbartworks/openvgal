<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenVGAL audience harness</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    header { padding: 0.6rem 1rem; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 0.9rem; font-weight: 500; margin: 0; color: #a5b4fc; letter-spacing: 0.04em; }
    header label { font-size: 0.78rem; color: #a1a1aa; }
    header input, header button { background: #222; color: #eee; border: 1px solid #333; padding: 0.25rem 0.5rem; font: inherit; border-radius: 4px; }
    main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
    iframe { border: 0; width: 100%; height: 100%; background: #000; }
    aside { background: #161616; border-left: 1px solid #2a2a2a; padding: 0.6rem; overflow: auto; font-size: 0.78rem; }
    aside h2 { font-size: 0.78rem; margin: 0 0 0.4rem; color: #a5b4fc; letter-spacing: 0.04em; text-transform: uppercase; }
    .ev { font-family: ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; border-left: 3px solid #6366f1; padding: 0.3rem 0.5rem; margin: 0.3rem 0; background: #1c1c1c; }
    .ev .ts { color: #71717a; font-size: 0.7rem; }
    .ev .ty { color: #a5b4fc; font-weight: 600; }
  </style>
</head>
<body>
  <!-- Serve the repo root (python -m http.server 8080) and open
       http://localhost:8080/docs/audience-test.html -->
  <header>
    <h1>OPENVGAL AUDIENCE HARNESS</h1>
    <label>viewer query <input id="query" value="dev=1&amp;audience=1" style="width: 18rem"></label>
    <button id="reload">Reload iframe</button>
    <button id="clear">Clear log</button>
  </header>
  <main>
    <iframe id="frame" src="about:blank"></iframe>
    <aside>
      <h2>Messages</h2>
      <div id="log"></div>
    </aside>
  </main>
  <script>
    const frame = document.getElementById('frame');
    const log = document.getElementById('log');
    const query = document.getElementById('query');

    // Permissive about origin for local testing; production parents validate event.origin.
    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (!msg || typeof msg !== 'object' || typeof msg.type !== 'string') return;
      const div = document.createElement('div');
      div.className = 'ev';
      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = new Date().toLocaleTimeString() + ' ';
      const ty = document.createElement('span');
      ty.className = 'ty';
      ty.textContent = msg.type;
      const { type, ...rest } = msg;
      div.append(ts, ty, document.createElement('br'), JSON.stringify(rest));
      log.prepend(div);
    });

    const load = () => { frame.src = '../site/viewer.html?' + query.value; };
    document.getElementById('reload').addEventListener('click', load);
    document.getElementById('clear').addEventListener('click', () => { log.replaceChildren(); });
    load();
  </script>
</body>
</html>
